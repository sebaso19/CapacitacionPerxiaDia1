<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro de proveedores</title>
  <style>
    :root{color-scheme:light dark;--ink:#102136;--muted:#657287;--paper:#f5f7fa;--line:#d9e0e8;--brand:#15601d;--accent:#6dfd8c}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--paper)}.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}aside{background:#102136;color:#edf4fa;padding:28px 22px}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.mark{width:28px;height:28px;background:var(--accent);border-radius:4px 14px 4px 14px}aside p{color:#b9c8d8;font-size:12px;margin:32px 0 10px}.case{display:block;width:100%;text-align:left;border:0;border-top:1px solid #314258;padding:12px 0;background:transparent;color:#e6edf5;cursor:pointer}.case:hover{color:var(--accent)}main{max-width:980px;width:100%;margin:auto;padding:36px;display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}h1{margin:0;font-size:24px}.status{color:var(--brand);font-weight:700;font-size:12px;background:#e7f7ea;padding:5px 9px;border-radius:99px}#chat{padding:24px 0;display:flex;flex-direction:column;gap:18px;overflow:auto}.message{max-width:76%;padding:14px 16px;border-radius:4px 16px 16px 16px;background:white;border:1px solid var(--line);white-space:pre-wrap}.user{align-self:flex-end;border-radius:16px 4px 16px 16px;background:#e7f7ea;border-color:#bde9c8}.tools{border-left:3px solid var(--brand);background:#f0f7f1;padding:12px 14px;font-size:12px}.tool{margin-top:8px;padding-top:8px;border-top:1px solid #cfe2d2;white-space:pre-wrap}.confirmation{border:1px solid #d8a62d;background:#fff9e8;color:#5f4500;padding:12px 14px;font-weight:650}form{display:flex;gap:10px;border-top:1px solid var(--line);padding-top:18px}input{flex:1;border:1px solid #b9c4d0;background:white;color:#102136;border-radius:6px;padding:13px;font:inherit}button[type=submit]{border:0;border-radius:6px;padding:0 18px;font-weight:800;cursor:pointer;color:white;background:var(--brand)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}@media(prefers-color-scheme:dark){body{--ink:#e7edf5;--muted:#acb8c5;--paper:#0c1723;--line:#283849}.message,input{background:#152434;color:#e7edf5;border-color:#34485c}.user,.tools{background:#153820;border-color:#317043}.status{background:#153820;color:#8deaa5}.confirmation{background:#33280d;color:#ffe8a3;border-color:#987720}}@media(max-width:700px){.shell{display:block}aside{padding:16px}aside p,.case{display:none}main{padding:20px;min-height:calc(100vh - 60px)}.message{max-width:92%}}
  </style>
</head>
<body>
<div class="shell"><aside><div class="brand"><span class="mark"></span>PERIFERIA <small>ADM</small></div><p>CASOS DISPONIBLES</p><button class="case">co-industrias-delta</button><button class="case">ec-corp-andina</button><button class="case">hn-agroexport-sula</button><button class="case">pa-logistica-istmo</button></aside><main><header><div><h1>Registro como proveedor</h1><span style="color:var(--muted)">Preparación trazable para revisión humana</span></div><span class="status">AGENTE LISTO</span></header><section id="chat" aria-live="polite"><div class="message">Hola. Puedo preparar un caso de registro, generar el formulario y armar el paquete para firma. Selecciona un caso o escribe su nombre.</div></section><form id="form"><input id="message" autocomplete="off" placeholder="Ej.: procesa el caso ec-corp-andina" aria-label="Mensaje"><button type="submit">Enviar</button></form></main></div>
<script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#message'),sessionId=crypto.randomUUID();
function add(text,klass='message'){const node=document.createElement('div');node.className=klass;node.textContent=text;chat.append(node);chat.scrollTop=chat.scrollHeight}
document.querySelectorAll('.case').forEach(button=>button.addEventListener('click',()=>{input.value=`Procesa el caso ${button.textContent}`;form.requestSubmit()}));
form.addEventListener('submit',async event=>{event.preventDefault();const message=input.value.trim();if(!message)return;add(message,'message user');input.value='';add('Procesando…','message thinking');const thinking=chat.lastElementChild;try{const response=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId,message})});const data=await response.json();thinking.remove();add(data.reply);if(data.toolCalls?.length){const panel=document.createElement('div');panel.className='tools';panel.textContent='Llamadas a herramientas';data.toolCalls.forEach(call=>{const row=document.createElement('div');row.className='tool';const result=call.result??{ok:call.ok,summary:call.summary};row.textContent=`${call.name} · ${result.ok?'correcto':'error'}\nArgumentos: ${JSON.stringify(call.args??call.Args??{})}\nResultado: ${result.summary??''}`;panel.append(row)});chat.append(panel)}if(data.needsConfirmation)add('Confirmación requerida: responde “confirmo” para crear únicamente el envío simulado.','confirmation')}catch{thinking.remove();add('No fue posible contactar el backend. Revisa que el servidor esté activo.','message confirmation')}});
</script>
</body>
</html>
